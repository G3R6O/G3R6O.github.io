<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PnL Input Table</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <h1>PnL Input Table</h1>
    <p class="subtitle">Enter values for each line item across 4 quarters.</p>
    <p><a href="index.html">Back to waterfall page</a></p>

    <section class="panel">
      <div class="table-wrap">
        <table id="pnl-table" aria-label="PnL quarterly input table">
          <thead>
            <tr>
              <th>Line Item</th>
              <th>Q1</th>
              <th>Q2</th>
              <th>Q3</th>
              <th>Q4</th>
              <th>FY Total</th>
            </tr>
          </thead>
          <tbody>
            <tr data-row="Revenue">
              <td>Revenue</td>
              <td><input type="number" value="100" class="pnl-input" /></td>
              <td><input type="number" value="110" class="pnl-input" /></td>
              <td><input type="number" value="120" class="pnl-input" /></td>
              <td><input type="number" value="130" class="pnl-input" /></td>
              <td class="row-total">0</td>
            </tr>
            <tr data-row="COGS">
              <td>COGS</td>
              <td><input type="number" value="-55" class="pnl-input" /></td>
              <td><input type="number" value="-60" class="pnl-input" /></td>
              <td><input type="number" value="-64" class="pnl-input" /></td>
              <td><input type="number" value="-70" class="pnl-input" /></td>
              <td class="row-total">0</td>
            </tr>
            <tr data-row="OPEX">
              <td>OPEX</td>
              <td><input type="number" value="-22" class="pnl-input" /></td>
              <td><input type="number" value="-24" class="pnl-input" /></td>
              <td><input type="number" value="-26" class="pnl-input" /></td>
              <td><input type="number" value="-28" class="pnl-input" /></td>
              <td class="row-total">0</td>
            </tr>
            <tr data-row="EBIT">
              <td>EBIT</td>
              <td class="ebit-quarter">0</td>
              <td class="ebit-quarter">0</td>
              <td class="ebit-quarter">0</td>
              <td class="ebit-quarter">0</td>
              <td id="ebit-total">0</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <h2>PnL Visual</h2>
      <section class="graph-card" aria-label="PnL chart">
        <canvas id="pnl-chart" width="720" height="360"></canvas>
      </section>
    </section>
  </main>

  <script src="pnl.js"></script>
</body>
</html>
